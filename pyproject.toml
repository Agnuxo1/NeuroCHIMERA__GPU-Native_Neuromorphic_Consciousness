[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "neurochimera"
version = "1.0.0"
description = "GPU-native neuromorphic computing framework with OpenGL compute shaders, Hierarchical Number System, and critical-parameter consciousness monitoring."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
    { name = "Francisco Angulo de Lafuente", email = "agnuxo1@gmail.com" },
    { name = "V.F. Veselov (Moscow Institute of Electronic Technology)" },
]
keywords = [
    "neuromorphic", "gpu", "opengl", "compute-shaders", "moderngl",
    "consciousness", "hierarchical-number-system", "simulation",
    "research", "cellular-automata",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
    "numpy>=1.23",
]

[project.optional-dependencies]
gpu = [
    "moderngl>=5.8",
    "PyOpenGL>=3.1",
]
dev = [
    "pytest>=7",
    "build>=1.0",
    "twine>=4.0",
]

[project.urls]
Homepage = "https://github.com/Agnuxo1/NeuroCHIMERA"
Repository = "https://github.com/Agnuxo1/NeuroCHIMERA"
Issues = "https://github.com/Agnuxo1/NeuroCHIMERA/issues"
Documentation = "https://github.com/Agnuxo1/NeuroCHIMERA#readme"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
neurochimera = ["*.glsl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
